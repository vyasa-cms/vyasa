# Copy to secret.yaml, fill in, and keep it out of version control.
# VYASA_ADMIN_* create the first administrator on the first boot; remove
# them from the Secret (and roll the Deployment) once you have signed in.
apiVersion: v1
kind: Secret
metadata:
  name: vyasa
  namespace: vyasa
type: Opaque
stringData:
  DATABASE_URL: postgres://vyasa:CHANGE-ME@postgres.vyasa.svc:5432/vyasa
  VYASA_SECRET_KEY: CHANGE-ME-openssl-rand-hex-32
  VYASA_ADMIN_EMAIL: you@example.com
  VYASA_ADMIN_PASSWORD: CHANGE-ME-at-least-eight-characters
