# Render Blueprint: one web service from the official image, a disk for
# uploads and the search index, a Render Postgres. See README.md.
services:
  - type: web
    name: vyasa
    runtime: image
    image:
      url: ghcr.io/vyasa-cms/vyasa:0.2.0
    plan: starter
    numInstances: 1
    healthCheckPath: /readyz
    disk:
      name: vyasa-data
      mountPath: /data
      sizeGB: 5
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vyasa-db
          property: connectionString
      - key: VYASA_RUN_DIR
        value: /tmp/vyasa-run
      - key: VYASA_INDEX_DIR
        value: /data/index
      - key: VYASA_MEDIA_DIR
        value: /data/media
      - key: VYASA_LOG__FORMAT
        value: json
      - key: VYASA_SECRET_KEY
        generateValue: true
      - key: VYASA_ADMIN_EMAIL
        sync: false
      - key: VYASA_ADMIN_PASSWORD
        sync: false

databases:
  - name: vyasa-db
    plan: basic-256mb
    postgresMajorVersion: "17"
