# cargo-deny: licences, advisories, sources. Run: cargo deny check
[graph]
all-features = false

[advisories]
version = 2
# Unmaintained crates block only when we depend on them directly; transitive
# ones (bincode/yaml-rust via syntect, fxhash via wasmtime) are tracked by
# Dependabot and upstream. Vulnerabilities always block.
unmaintained = "workspace"
# Keep in step with .cargo/audit.toml: every ignore there needs one here,
# with the same reason.
ignore = [
    # zip 8.6.0 is locked only as a build dependency of utoipa-swagger-ui
    # 10.0.1 (the latest), whose build script unpacks the pinned Swagger UI
    # release zip without calling ZipArchive::extract. All three advisories
    # are about extract() on hostile archives; the workspace itself uses
    # zip 9. Remove when utoipa-swagger-ui moves to zip 9.
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause",
    "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0",
    "MPL-2.0", "CC0-1.0", "BSL-1.0", "CDLA-Permissive-2.0", "0BSD",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
# Workspace crates depend on each other by path without a version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
