# cargo-deny: licences, advisories, sources. Run: cargo deny check
[graph]
all-features = false

[advisories]
version = 2
# Unmaintained crates block only when we depend on them directly; transitive
# ones (bincode/yaml-rust via syntect, fxhash via wasmtime) are tracked by
# Dependabot and upstream. Vulnerabilities always block.
unmaintained = "workspace"
# Ignores here are for what cargo-deny sees in the built graph; .cargo/audit.toml
# has its own list for the whole lockfile. Each needs a reason.
ignore = [
    # chrono and chrono-tz are flagged unmaintained (RUSTSEC-2026-0543,
    # -0555) with no replacement released; both are direct dependencies used
    # for timestamps and schedule time zones. Revisit when upstream or a
    # drop-in successor is available.
    "RUSTSEC-2026-0543",
    "RUSTSEC-2026-0555",
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause",
    "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0",
    "MPL-2.0", "CC0-1.0", "BSL-1.0", "CDLA-Permissive-2.0", "0BSD",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
# Workspace crates depend on each other by path without a version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
