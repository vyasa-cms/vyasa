name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: { label: What happened, description: "And what you expected instead." }
    validations: { required: true }
  - type: textarea
    id: steps
    attributes: { label: Steps to reproduce }
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: Vyasa version or commit }
    validations: { required: true }
  - type: dropdown
    id: install
    attributes:
      label: How you run it
      options: [Docker image, Release binary, Built from source, Other]
    validations: { required: true }
  - type: textarea
    id: logs
    attributes: { label: Relevant logs, render: text }
