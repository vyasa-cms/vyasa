name: Release

# A `v*` tag builds every artefact on its own platform (no cross-compiling:
# aws-lc-sys wants a native toolchain), attests each one, publishes the
# multi-arch image, smoke-tests the README quick start against it, and only
# then creates the GitHub release. Tags with a `-` (v0.1.0-rc.1) are
# prereleases: marked as such, and they never move `latest`.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  meta:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"; publish=true
          else
            version="0.0.0-dev.${GITHUB_SHA::7}"; publish=false
          fi
          prerelease=false; [[ "$version" == *-* ]] && prerelease=true
          {
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
      # Fail before building anything when the tag has no changelog entry,
      # or names a version the binary would not report as its own.
      - if: steps.v.outputs.publish == 'true'
        run: |
          scripts/release-notes.sh "${{ steps.v.outputs.version }}" > /dev/null
          scripts/check-release-version.sh "${{ steps.v.outputs.version }}"

  admin:
    name: Admin bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: admin/pnpm-lock.yaml
      - working-directory: admin
        run: pnpm install --frozen-lockfile && pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: admin-dist
          path: admin/dist

  binary:
    name: Binary (${{ matrix.target }})
    needs: [meta, admin]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 runners: glibc 2.35, so the archives start on
          # Debian 12, Ubuntu 22.04 and newer.
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04, public_only: false }
          # Free arm64 Linux runners exist only for public repositories.
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm, public_only: true }
          - { target: aarch64-apple-darwin, os: macos-14, public_only: false }
    # A public-only entry on a private repository lands on an ordinary
    # runner where every step is skipped, instead of waiting for an arm64
    # runner that never comes.
    runs-on: ${{ (matrix.public_only && github.event.repository.private) && 'ubuntu-latest' || matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        if: ${{ !matrix.public_only || !github.event.repository.private }}
      - uses: dtolnay/rust-toolchain@1.120
        if: ${{ !matrix.public_only || !github.event.repository.private }}
      - uses: Swatinem/rust-cache@v2
        if: ${{ !matrix.public_only || !github.event.repository.private }}
        with:
          key: ${{ matrix.target }}
      - name: Build
        if: ${{ !matrix.public_only || !github.event.repository.private }}
        run: cargo build --release --locked --bin vyasa
      - uses: actions/download-artifact@v4
        if: ${{ !matrix.public_only || !github.event.repository.private }}
        with:
          name: admin-dist
          path: admin-dist
      - name: Package
        if: ${{ !matrix.public_only || !github.event.repository.private }}
        run: scripts/package-release.sh "${{ needs.meta.outputs.version }}" "${{ matrix.target }}" target/release/vyasa admin-dist dist
      - uses: actions/attest-build-provenance@v2
        # Artifact attestations need a public repository on GitHub's free plan.
        if: ${{ (!matrix.public_only || !github.event.repository.private) && needs.meta.outputs.publish == 'true' && !github.event.repository.private }}
        with:
          subject-path: dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        if: ${{ !matrix.public_only || !github.event.repository.private }}
        with:
          name: archive-${{ matrix.target }}
          path: dist/*

  image:
    name: Image (${{ matrix.platform }})
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux/amd64, os: ubuntu-latest, public_only: false }
          - { platform: linux/arm64, os: ubuntu-24.04-arm, public_only: true }
    runs-on: ${{ (matrix.public_only && github.event.repository.private) && 'ubuntu-latest' || matrix.os }}
    permissions:
      contents: read
      packages: write
    steps:
      - id: arch
        if: ${{ !matrix.public_only || !github.event.repository.private }}
        run: echo "name=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"
        env:
          PLATFORM: ${{ matrix.platform }}
      - uses: actions/checkout@v4
        if: ${{ !matrix.public_only || !github.event.repository.private }}
      - uses: docker/setup-buildx-action@v4
        if: ${{ !matrix.public_only || !github.event.repository.private }}
      - uses: docker/login-action@v4
        if: ${{ !matrix.public_only || !github.event.repository.private }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        if: ${{ !matrix.public_only || !github.event.repository.private }}
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ needs.meta.outputs.publish }}
          cache-from: type=gha,scope=${{ steps.arch.outputs.name }}
          cache-to: type=gha,mode=max,scope=${{ steps.arch.outputs.name }}
      - name: Record digest
        if: ${{ !matrix.public_only || !github.event.repository.private }}
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v4
        if: ${{ !matrix.public_only || !github.event.repository.private }}
        with:
          name: digest-${{ steps.arch.outputs.name }}
          path: digests/*

  manifest:
    name: Image manifest
    needs: [meta, image]
    if: needs.meta.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.inspect.outputs.digest }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tags
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.meta.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ needs.meta.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ needs.meta.outputs.prerelease == 'false' }}
      - name: Create manifest
        working-directory: digests
        run: |
          set -euo pipefail
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)
      - id: inspect
        run: |
          digest=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
        env:
          VERSION: ${{ needs.meta.outputs.version }}
      - uses: actions/attest-build-provenance@v2
        if: ${{ !github.event.repository.private }}
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.inspect.outputs.digest }}
          push-to-registry: true

  smoke:
    name: Quick start smoke test
    needs: [meta, manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: scripts/smoke-quickstart.sh "${{ needs.meta.outputs.version }}"

  release:
    name: GitHub release
    needs: [meta, binary, smoke]
    if: needs.meta.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          path: dist
          merge-multiple: true
      - run: scripts/release-notes.sh "${{ needs.meta.outputs.version }}" > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          prerelease: ${{ needs.meta.outputs.prerelease == 'true' }}
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
