name: Notify the website

# vyasa.site (vyasa-cms/website) builds its docs and API reference from this
# repository. When they change on main, ask it to rebuild. Needs a token
# that may send a repository_dispatch to vyasa-cms/website (secret
# WEBSITE_DISPATCH_TOKEN); without it this does nothing and the website's
# daily rebuild picks the change up instead.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "CONTRIBUTING.md"
      - "admin/openapi.json"

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Ask vyasa-cms/website to rebuild
        env:
          TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "WEBSITE_DISPATCH_TOKEN is not set; the website's daily build will pick this up."
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/vyasa-cms/website/dispatches \
            -d '{"event_type":"docs-changed"}'
