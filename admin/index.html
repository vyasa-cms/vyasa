<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fdfbf9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <title>Vyasa Admin</title>
    <!--
      Pre-paint theme resolution. Must stay a same-origin <script src> and not
      an inline block: the server sends `script-src 'self'`, which blocks
      inline scripts. Blocking (no defer/async) so it runs before first paint.
    -->
    <script src="/assets/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
