[workspace]

[package]
name = "vyasa-plugin-bookshelf"
version = "0.4.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Example Vyasa plugin exercising the whole v2 contract"

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.30"
serde_json = "1"

[profile.release]
strip = true
lto = true
opt-level = "s"
