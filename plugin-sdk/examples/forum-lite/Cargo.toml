[workspace]

[package]
name = "vyasa-plugin-forum-lite"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Reference community plugin: topics as entries, replies as core comments"

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.30"
serde_json = "1"

[profile.release]
strip = true
lto = true
opt-level = "s"
