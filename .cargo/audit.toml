# cargo-audit policy. Everything not listed here fails the gate.
#
# cargo-audit reads the whole lockfile; cargo-deny (deny.toml) resolves the
# real dependency graph, so an advisory for a crate that is locked but never
# built appears here and not there.
[advisories]
ignore = [
    # rsa 0.9 Marvin timing attack. Locked through sqlx-mysql, which this
    # workspace never builds or connects with: Vyasa speaks Postgres only.
    # No fixed rsa release exists yet; revisit when one does.
    "RUSTSEC-2023-0071",
    # zip 8.6.0 is locked only as a build dependency of utoipa-swagger-ui
    # 10.0.1 (the latest), whose build script unpacks the pinned Swagger UI
    # release zip without calling ZipArchive::extract. All three advisories
    # are about extract() on hostile archives; the workspace itself uses
    # zip 9. Remove when utoipa-swagger-ui moves to zip 9.
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
]
