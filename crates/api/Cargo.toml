[package]
publish = false
name = "vyasa-api"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Vyasa API server binary (composition root)"

[[bin]]
name = "vyasa"
path = "src/main.rs"

[lints]
workspace = true

[features]
importer = ["dep:html5ever", "dep:ammonia", "dep:ureq"]
ureq = ["dep:ureq"]

[dependencies]
moka = { version = "0.12", features = ["sync"] }
vyasa-search = { path = "../search" }
ammonia = { version = "4.2", optional = true }
axum = { version = "0.8", features = ["json", "tokio", "http1", "multipart"] }
chrono-tz = "0.10"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
clap = { version = "4", features = ["derive"] }
vyasa-common = { path = "../common" }
vyasa-core = { path = "../core" }
vyasa-db = { path = "../db" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tracing = "0.1"
utoipa = { version = "6", features = ["axum_extras", "chrono", "macros"] }
utoipa-swagger-ui = { version = "10", features = ["axum", "vendored"] }
rpassword = "7"
sha2 = "0.11"
hmac = "0.13"
base64 = "0.23"
rand = "0.8"
toml = "1"
totp-rs = { version = "6", features = ["gen_secret", "otpauth"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
fs2 = "0.4"
hex = "0.4"
async-trait = "0.1"
vyasa-jobs = { path = "../jobs" }
async-graphql = { version = "7", features = ["dataloader", "chrono", "tracing"] }
async-graphql-axum = "7"
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
vyasa-themes = { path = "../themes" }
rss = "2"
atom_syndication = "0.12"
zip = { version = "8", default-features = false, features = ["deflate"] }
html5ever = { version = "0.40", optional = true }
ureq = { version = "2", optional = true }
vyasa-plugins = { path = "../plugins" }
ed25519-dalek = "3"
vyasa-ai = { path = "../ai" }
schemars = "1.2.2"
reqwest = "0.13.4"
url = "2"
mime_guess = "2.0"
semver = "1.0.28"

[dev-dependencies]
totp-rs = { version = "6", features = ["otpauth"] }
feed-rs = "2.4.0"
futures = { version = "0.3.34", features = ["executor"] }
vyasa-core = { path = "../core" }
vyasa-testkit = { path = "../testkit" }
serde_json = "1"
sha2 = "0.11"
ureq = { version = "2", default-features = false, features = ["json", "tls"] }
zip = { version = "8", default-features = false, features = ["deflate"] }
tempfile = "3.27.0"
tower = { version = "0.5", features = ["util"] }

