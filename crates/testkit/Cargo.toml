[package]
name = "vyasa-testkit"
description = "Test fixtures: a Postgres database per test and the server under test"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
rand = "0.8"
sha2 = "0.11"
socket2 = "0.6"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "macros"] }
tokio = { version = "1", features = ["rt", "sync", "macros", "time"] }
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
