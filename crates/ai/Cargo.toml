[package]
publish = false
name = "vyasa-ai"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Vyasa ai crate"

[lints]
workspace = true

[dependencies]
reqwest = { version = "0.13.4", features = ["json", "multipart"] }
base64 = "0.23"
vyasa-common = { path = "../common" }
vyasa-core = { path = "../core" }
vyasa-themes = { path = "../themes" }
schemars = "1.2.2"
# Sarathi, an embeddable agent harness: a git dependency pinned to a commit,
# allowed by name in deny.toml. Bump `rev` deliberately, never to a branch.
sarathi-tools = { git = "https://github.com/KrishivAI/sarathi", rev = "73ff75a43b1adc1aa509b4ab7937c7fef0ce40d9" }
serde = "1.0.229"
serde_json = "1.0.151"
tracing = "0.1"

[dev-dependencies]
tokio = "1.53.1"
