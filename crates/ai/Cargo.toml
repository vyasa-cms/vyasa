[package]
publish = false
name = "vyasa-ai"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Vyasa ai crate"

[lints]
workspace = true

[dependencies]
reqwest = { version = "0.13.4", features = ["json", "multipart"] }
base64 = "0.23"
vyasa-common = { path = "../common" }
vyasa-core = { path = "../core" }
vyasa-themes = { path = "../themes" }
schemars = "1.2.2"
# Sarathi, an embeddable agent harness: a git dependency pinned to a commit,
# allowed by name in deny.toml. Bump `rev` deliberately, never to a branch.
sarathi-core = { git = "https://github.com/KrishivAI/sarathi", rev = "8b76a3584396a27168fc26e6206eb00be8967b96" }
sarathi-log = { git = "https://github.com/KrishivAI/sarathi", rev = "8b76a3584396a27168fc26e6206eb00be8967b96" }
sarathi-protocol = { git = "https://github.com/KrishivAI/sarathi", rev = "8b76a3584396a27168fc26e6206eb00be8967b96" }
sarathi-provider = { git = "https://github.com/KrishivAI/sarathi", rev = "8b76a3584396a27168fc26e6206eb00be8967b96" }
sarathi-tools = { git = "https://github.com/KrishivAI/sarathi", rev = "8b76a3584396a27168fc26e6206eb00be8967b96" }
serde = "1.0.229"
serde_json = "1.0.151"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt", "net", "io-util"] }
