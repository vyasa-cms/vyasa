[package]
publish = false
name = "vyasa-jobs"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Vyasa jobs crate"

[lints]
workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
vyasa-common = { path = "../common" }
vyasa-core = { path = "../core" }
vyasa-db = { path = "../db" }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres"] }
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "net", "io-util"] }
tracing = "0.1"
rand = "0.8"
reqwest = "0.13.4"
url = "2"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1-rustls-tls", "builder", "hostname"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
vyasa-testkit = { path = "../testkit" }
