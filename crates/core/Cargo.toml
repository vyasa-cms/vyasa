[package]
publish = false
name = "vyasa-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Vyasa core crate"

[lints]
workspace = true

[dependencies]
argon2 = "0.6"
base64 = "0.22"
chrono-tz = "0.9"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
hmac = "0.13"
rand = "0.8"
sha2 = "0.11"
chacha20poly1305 = "0.11"
vyasa-common = { path = "../common" }
vyasa-db = { path = "../db" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
] }
tokio = { version = "1", features = ["sync", "fs", "io-util", "macros", "rt"] }
tracing = "0.1"
async-trait = "0.1"
infer = "0.22"
mime_guess = "2.0"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
blurhash = "0.2"
tera = "2.2.0"
webp = "0.3"

[dev-dependencies]
futures = "0.3.34"
vyasa-themes = { path = "../themes" }
vyasa-testkit = { path = "../testkit" }
tempfile = "3"
